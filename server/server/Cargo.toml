[package]
name = "server"
description = "Game server: network, persistence and the simulation loop. The only crate that talks to the outside world."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sim = { path = "../sim" }
protocol = { path = "../protocol" }
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "sync", "macros", "signal", "time"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { version = "0.41.1", features = ["bundled"] }

[lints]
workspace = true
