[workspace]
resolver = "2"
members = ["sim", "protocol", "server", "vivarium", "planet"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Torof/soul-invasion"
rust-version = "1.90"
# Workspace crates are never published to crates.io.
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
thiserror = "2"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# The simulation's tests run its generators over whole continents: they
# need it optimised. Dependencies stay at 0: measured 19 November 2026
# (whole `cargo test --workspace`, 16 threads, two runs each), opt-level 3
# for every dependency, with sim at 2 or 3, saved no test time (the server's
# tests 30-35 s at 0, 37-38 s at 3; sim's lib 73 s either way) and cost
# 90 s more on a cold build (92 s -> 182-189 s).
[profile.dev.package.sim]
opt-level = 2
# The planet's tests run its plate history over the whole grid: optimised
# like sim's (a planet is born in ~1.5 s in release).
[profile.dev.package.planet]
opt-level = 2

# The try build of the planet's rounds of work (`--profile essai`, for
# `cargo run` and `cargo test --lib` alike): release at opt-level 1 with
# incremental compilation, and the dev profile's overflow checks and
# debug assertions. Measured 27 November 2026 on a one-line change of
# the model: the example rebuilt in 2.8 s (release: 4 s), the tests in
# 2.3 s; a planet born in 4.3 s (release: 3.6 s). The worlds are the same
# under both (integers only); the final runs use release.
[profile.essai]
inherits = "release"
opt-level = 1
incremental = true
overflow-checks = true
debug-assertions = true
