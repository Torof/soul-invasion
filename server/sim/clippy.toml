# Clippy configuration of the `sim` crate only (clippy reads the
# `clippy.toml` nearest the crate's manifest).
#
# Invariant R7: world generation is integer-only, so that a seed gives the
# same world on every machine and every build (D24). The float functions
# below are computed by the platform's maths library or by fused
# instructions, and are not guaranteed to round the same way everywhere.
#
# A clippy.toml cannot be scoped to modules, so this list applies to the
# whole `sim` crate: today only generator code calls any of these, and
# each such call carries an explicit `#[allow(clippy::disallowed_methods)]`
# listing it as a known exception, to remove when the generator is
# rewritten (stage 1). Float arithmetic itself (`+ - * /` on floats) is
# forbidden per module by `#![warn(clippy::float_arithmetic)]` at the top
# of each generator module.
disallowed-methods = [
    { path = "f32::powf", reason = "R7: generation is integer-only; use a table or fixed point" },
    { path = "f64::powf", reason = "R7: generation is integer-only; use a table or fixed point" },
    { path = "f32::powi", reason = "R7: generation is integer-only; use integer powers" },
    { path = "f64::powi", reason = "R7: generation is integer-only; use integer powers" },
    { path = "f32::sqrt", reason = "R7: generation is integer-only; use isqrt" },
    { path = "f64::sqrt", reason = "R7: generation is integer-only; use isqrt" },
    { path = "f32::cbrt", reason = "R7: generation is integer-only" },
    { path = "f64::cbrt", reason = "R7: generation is integer-only" },
    { path = "f32::hypot", reason = "R7: generation is integer-only; use isqrt of a sum of squares" },
    { path = "f64::hypot", reason = "R7: generation is integer-only; use isqrt of a sum of squares" },
    { path = "f32::exp", reason = "R7: generation is integer-only; use a table" },
    { path = "f64::exp", reason = "R7: generation is integer-only; use a table" },
    { path = "f32::exp2", reason = "R7: generation is integer-only; use a table" },
    { path = "f64::exp2", reason = "R7: generation is integer-only; use a table" },
    { path = "f32::exp_m1", reason = "R7: generation is integer-only; use a table" },
    { path = "f64::exp_m1", reason = "R7: generation is integer-only; use a table" },
    { path = "f32::ln", reason = "R7: generation is integer-only; use a table" },
    { path = "f64::ln", reason = "R7: generation is integer-only; use a table" },
    { path = "f32::ln_1p", reason = "R7: generation is integer-only; use a table" },
    { path = "f64::ln_1p", reason = "R7: generation is integer-only; use a table" },
    { path = "f32::log", reason = "R7: generation is integer-only; use a table" },
    { path = "f64::log", reason = "R7: generation is integer-only; use a table" },
    { path = "f32::log2", reason = "R7: generation is integer-only; use ilog2 or a table" },
    { path = "f64::log2", reason = "R7: generation is integer-only; use ilog2 or a table" },
    { path = "f32::log10", reason = "R7: generation is integer-only; use ilog10 or a table" },
    { path = "f64::log10", reason = "R7: generation is integer-only; use ilog10 or a table" },
    { path = "f32::sin", reason = "R7: generation is integer-only; use a sine table" },
    { path = "f64::sin", reason = "R7: generation is integer-only; use a sine table" },
    { path = "f32::cos", reason = "R7: generation is integer-only; use a sine table" },
    { path = "f64::cos", reason = "R7: generation is integer-only; use a sine table" },
    { path = "f32::sin_cos", reason = "R7: generation is integer-only; use a sine table" },
    { path = "f64::sin_cos", reason = "R7: generation is integer-only; use a sine table" },
    { path = "f32::tan", reason = "R7: generation is integer-only; use a table" },
    { path = "f64::tan", reason = "R7: generation is integer-only; use a table" },
    { path = "f32::asin", reason = "R7: generation is integer-only; use a table" },
    { path = "f64::asin", reason = "R7: generation is integer-only; use a table" },
    { path = "f32::acos", reason = "R7: generation is integer-only; use a table" },
    { path = "f64::acos", reason = "R7: generation is integer-only; use a table" },
    { path = "f32::atan", reason = "R7: generation is integer-only; use a table" },
    { path = "f64::atan", reason = "R7: generation is integer-only; use a table" },
    { path = "f32::atan2", reason = "R7: generation is integer-only; use a table" },
    { path = "f64::atan2", reason = "R7: generation is integer-only; use a table" },
    { path = "f32::sinh", reason = "R7: generation is integer-only" },
    { path = "f64::sinh", reason = "R7: generation is integer-only" },
    { path = "f32::cosh", reason = "R7: generation is integer-only" },
    { path = "f64::cosh", reason = "R7: generation is integer-only" },
    { path = "f32::tanh", reason = "R7: generation is integer-only" },
    { path = "f64::tanh", reason = "R7: generation is integer-only" },
    { path = "f32::mul_add", reason = "R7: generation is integer-only; fused or not depends on the target" },
