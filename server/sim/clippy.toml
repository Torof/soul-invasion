# Clippy configuration of the `sim` crate only (clippy reads the
# `clippy.toml` nearest the crate's manifest).
#
# World generation is integer-only, so that a seed gives the same world on
# every machine and every build (D24). The float functions below are
# computed by the platform's maths library or by fused instructions, and
# are not guaranteed to round the same way everywhere.
#
# A clippy.toml cannot be scoped to modules, so this list applies to the
# whole `sim` crate. Each call that remains carries an explicit
# `#[allow(clippy::disallowed_methods)]` saying why: either a known
# exception of today's generator, to remove when the generator is
# rewritten (the drawn height in `trees`, the patch shapes in `flora`), or
# code that is not generation and stays (`FinePos::distance_to`, which
# moves bodies). Float arithmetic itself (`+ - * /` on floats) is linted
# for the whole crate by `#![warn(clippy::float_arithmetic)]` in `lib.rs`.
disallowed-methods = [
    { path = "f32::powf", reason = "generation is integer-only (D24); use a table or fixed point" },
    { path = "f64::powf", reason = "generation is integer-only (D24); use a table or fixed point" },
    { path = "f32::powi", reason = "generation is integer-only (D24); use integer powers" },
    { path = "f64::powi", reason = "generation is integer-only (D24); use integer powers" },
    { path = "f32::sqrt", reason = "generation is integer-only (D24); use isqrt" },
    { path = "f64::sqrt", reason = "generation is integer-only (D24); use isqrt" },
    { path = "f32::cbrt", reason = "generation is integer-only (D24)" },
    { path = "f64::cbrt", reason = "generation is integer-only (D24)" },
    { path = "f32::hypot", reason = "generation is integer-only (D24); use isqrt of a sum of squares" },
    { path = "f64::hypot", reason = "generation is integer-only (D24); use isqrt of a sum of squares" },
    { path = "f32::exp", reason = "generation is integer-only (D24); use a table" },
    { path = "f64::exp", reason = "generation is integer-only (D24); use a table" },
    { path = "f32::exp2", reason = "generation is integer-only (D24); use a table" },
    { path = "f64::exp2", reason = "generation is integer-only (D24); use a table" },
    { path = "f32::exp_m1", reason = "generation is integer-only (D24); use a table" },
    { path = "f64::exp_m1", reason = "generation is integer-only (D24); use a table" },
    { path = "f32::ln", reason = "generation is integer-only (D24); use a table" },
    { path = "f64::ln", reason = "generation is integer-only (D24); use a table" },
    { path = "f32::ln_1p", reason = "generation is integer-only (D24); use a table" },
    { path = "f64::ln_1p", reason = "generation is integer-only (D24); use a table" },
    { path = "f32::log", reason = "generation is integer-only (D24); use a table" },
    { path = "f64::log", reason = "generation is integer-only (D24); use a table" },
    { path = "f32::log2", reason = "generation is integer-only (D24); use ilog2 or a table" },
    { path = "f64::log2", reason = "generation is integer-only (D24); use ilog2 or a table" },
    { path = "f32::log10", reason = "generation is integer-only (D24); use ilog10 or a table" },
    { path = "f64::log10", reason = "generation is integer-only (D24); use ilog10 or a table" },
    { path = "f32::sin", reason = "generation is integer-only (D24); use a sine table" },
    { path = "f64::sin", reason = "generation is integer-only (D24); use a sine table" },
    { path = "f32::cos", reason = "generation is integer-only (D24); use a sine table" },
    { path = "f64::cos", reason = "generation is integer-only (D24); use a sine table" },
    { path = "f32::sin_cos", reason = "generation is integer-only (D24); use a sine table" },
    { path = "f64::sin_cos", reason = "generation is integer-only (D24); use a sine table" },
    { path = "f32::tan", reason = "generation is integer-only (D24); use a table" },
    { path = "f64::tan", reason = "generation is integer-only (D24); use a table" },
    { path = "f32::asin", reason = "generation is integer-only (D24); use a table" },
