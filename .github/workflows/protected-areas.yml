name: Protected areas

# Required status check. Fails when a pull request changes a protected path
# (declared in .github/CODEOWNERS) and does not carry the `lead-approved`
# label. Only the project lead adds that label, after reading the change.
#
# Why a label and not a GitHub review: the AI opens pull requests from the
# project lead's own account, and GitHub does not let an author approve their
# own pull request. The label is the project lead's explicit approval.
#
# What the pull request may not influence (audit of 20 November 2026, R2, R3):
#   - the rules: CODEOWNERS is read from the base branch through the API,
#     never from the pull request's head, so a pull request that edits
#     CODEOWNERS is judged by the rules it tries to change;
#   - the list: a renamed file counts under its old path too, so a file
#     moved out of a protected area still needs the label;
#   - nothing is checked out: the job has no copy of the pull request.
# What remains with GitHub's settings, not with this file: on `pull_request`
# the workflow file itself comes from the pull request's head. Branch
# protection must require this check from GitHub Actions only (not "any
# source"), and a ruleset may require `main`'s copy of this workflow.
# `pull_request_target` is not used: GitHub blocks it by default on public
# repositories (see auto-merge.yml).
#
# Token: `contents: read` (CODEOWNERS of the base branch) and
# `pull-requests: read` (the pull request's file list). Nothing else.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Protected areas
    runs-on: ubuntu-latest
    steps:
      - name: Read CODEOWNERS from the base branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        # The base branch as it is now (its tip, not the sha the pull
        # request was opened against): the rules in force at merge time.
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/contents/.github/CODEOWNERS?ref=${BASE_REF}" \
            -H "Accept: application/vnd.github.raw+json" > CODEOWNERS
          echo "CODEOWNERS read from ${BASE_REF}: $(grep -c '@' CODEOWNERS) rules."
      - name: List changed files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        # Every changed file, page after page: `gh pr view --json files`
        # stops at 100 files, and a larger pull request (#215, 239 files)
        # merged with its protected files unseen (12 November 2026). The
        # API itself lists at most 3,000 files: past that, refuse.
        # A rename gives `filename` (new path) and `previous_filename` (old
        # path): both are checked, so a file moved out of a protected area
        # still needs the label.
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
            --jq '.[] | "\(.filename)\t\(.previous_filename // "")"' > files.tsv
          total=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.changed_files')
          listed=$(wc -l < files.tsv)
          echo "Changed files: ${listed} listed of ${total}."
          if [ "${listed}" -lt "${total}" ]; then
            echo "Not every changed file could be listed: split the pull request."
            exit 1
          fi
          tr '\t' '\n' < files.tsv | grep -v '^$' > changed.txt
      - name: Compare with CODEOWNERS
        env:
          APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'lead-approved') }}
        run: |
          python3 - <<'EOF'
          import os, re, sys

          def to_regex(pattern: str) -> re.Pattern:
              # CODEOWNERS subset: leading "/" anchors at the repo root,
              # trailing "/" matches a directory, "*" matches within a segment.
              anchored = pattern.startswith("/")
              p = pattern.strip("/")
              body = "".join("[^/]*" if c == "*" else re.escape(c) for c in p)
              if pattern.endswith("/"):
                  body += "(/.*)?"
              return re.compile(("^" if anchored else "(^|.*/)") + body + "$")

          rules = []
          with open("CODEOWNERS", encoding="utf-8") as f:
              for line in f:
                  line = line.split("#", 1)[0].strip()
                  if line:
                      rules.append((line.split()[0], to_regex(line.split()[0])))

          changed = [l.strip() for l in open("changed.txt", encoding="utf-8") if l.strip()]
          hits = {path: pat for path in changed for pat, rx in rules if rx.match(path)}

          if not hits:
              print("No protected path changed.")
              sys.exit(0)
          print("Protected paths changed:")
          for path, pat in hits.items():
              print(f"  {path}  (rule: {pat})")
          if os.environ["APPROVED"] == "true":
              print("Label `lead-approved` present: approved by the project lead.")
              sys.exit(0)
          print("\nMissing label `lead-approved`. The project lead must read this change and add the label.")
          sys.exit(1)
          EOF
