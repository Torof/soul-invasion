name: Auto-merge

# Enables GitHub's native auto-merge on every pull request.
# This is safe because branch protection on `main` does the gating:
#   - all CI checks must be green;
#   - any change to a protected area (see CODEOWNERS) requires a review
#     from the project lead before the merge can happen.
# A pull request that touches nothing protected merges itself once CI is green.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: Enable auto-merge
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
