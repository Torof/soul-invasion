name: Auto-merge

# Enables GitHub's native auto-merge on every pull request.
# This is safe because branch protection on `main` does the gating:
#   - all CI checks must be green;
#   - any change to a protected area (see CODEOWNERS) requires the
#     `lead-approved` label from the project lead (Protected areas check).
# A pull request that touches nothing protected merges itself once CI is green.
#
# Why `pull_request_target`: on `pull_request` events opened by Dependabot the
# GITHUB_TOKEN is read-only and cannot enable auto-merge. `pull_request_target`
# runs in the context of the base branch with write access. This job never
# checks out or executes code from the pull request, so that is safe.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: Enable auto-merge
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
