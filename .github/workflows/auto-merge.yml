name: Auto-merge

# Enables GitHub's native auto-merge on every pull request.
# This is safe because branch protection on `main` does the gating:
#   - all CI checks must be green;
#   - any change to a protected area (see CODEOWNERS) requires the
#     `lead-approved` label from the project lead (Protected areas check).
# A pull request that touches nothing protected merges itself once CI is green.
#
# Only pull requests into `main` are enabled: a stacked pull request whose
# base is another feature branch is not gated by branch protection and would
# otherwise merge into it as soon as its CI is green, label or not.
#
# Why `pull_request` (9 November 2026): it was `pull_request_target`, so that
# Dependabot's pull requests got a token able to enable auto-merge. GitHub
# now blocks `pull_request_target` by default on public repositories (it
# runs with write access on code from forks), and since Dependabot's
# `pull_request` runs honour the `permissions` below, plain `pull_request`
# does the same safely. A pull request from a fork gets a read-only token:
# it does not merge itself, the project lead merges it by hand.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: Enable auto-merge
    # A fork's pull request is left alone (its token cannot enable it).
    if: >-
      ${{ !github.event.pull_request.draft
      && github.event.pull_request.base.ref == 'main'
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
