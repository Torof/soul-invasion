name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GODOT_VERSION: 4.7.2

jobs:
  server:
    name: Server (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - name: What changed
        working-directory: .
        id: changed
        # On a pull request only what it touches is checked:
        # the server, the content it reads, or the CI itself.
        # On main, everything always is.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qE '^(server/|content/|\.github/)'; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Nothing here for this job: skipped."
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changed.outputs.run == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changed.outputs.run == 'true'
        with:
          workspaces: server
      - name: Format
        if: steps.changed.outputs.run == 'true'
        run: cargo fmt --all --check
      - name: Lint (warnings are errors)
        if: steps.changed.outputs.run == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        if: steps.changed.outputs.run == 'true'
        run: cargo build --workspace --all-targets
      - name: Test
        if: steps.changed.outputs.run == 'true'
        run: cargo test --workspace
      - name: Docs build cleanly
        if: steps.changed.outputs.run == 'true'
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  dependencies:
    name: Dependency audit (licenses, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: What changed
        id: changed
        # On a pull request only what it touches is checked:
        # the dependencies (Cargo files, deny.toml) or the CI itself.
        # On main, everything always is.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qE '^(server/Cargo\.(toml|lock)|server/[^/]+/Cargo\.toml|server/deny\.toml|\.github/)'; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Nothing here for this job: skipped."
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: EmbarkStudios/cargo-deny-action@v2
        if: steps.changed.outputs.run == 'true'
        with:
          manifest-path: server/Cargo.toml
          command: check

  client:
    name: Client (Godot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: What changed
        id: changed
        # On a pull request only what it touches is checked:
        # the client, the protocol it mirrors, the content its tests read, or the CI itself.
        # On main, everything always is.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qE '^(client/|server/protocol/|content/|\.github/)'; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Nothing here for this job: skipped."
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Godot (headless)
        if: steps.changed.outputs.run == 'true'
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Import project
        if: steps.changed.outputs.run == 'true'
        run: godot --headless --path client --import
      - name: Run client tests
        if: steps.changed.outputs.run == 'true'
        run: godot --headless --path client -s tests/run_tests.gd
