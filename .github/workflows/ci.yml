name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GODOT_VERSION: 4.7.2
  # From SHA512-SUMS.txt of the same release (github.com/godotengine/godot/releases):
  # a download that does not match is refused. Update both together.
  GODOT_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65

jobs:
  server:
    name: Server (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: What changed
        working-directory: .
        id: changed
        # On a pull request only what it touches is checked:
        # the server, the content it reads, or the CI itself.
        # On main, everything always is.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qE '^(server/|content/|\.github/)'; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Nothing here for this job: skipped."
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        if: steps.changed.outputs.run == 'true'
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changed.outputs.run == 'true'
        with:
          workspaces: server
      - name: Format
        if: steps.changed.outputs.run == 'true'
        run: cargo fmt --all --check
      - name: Lint (warnings are errors)
        if: steps.changed.outputs.run == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        if: steps.changed.outputs.run == 'true'
        run: cargo build --workspace --all-targets
      - name: Test
        if: steps.changed.outputs.run == 'true'
        run: cargo test --workspace
      - name: Docs build cleanly
        if: steps.changed.outputs.run == 'true'
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  dependencies:
    name: Dependency audit (licenses, advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: What changed
        id: changed
        # On a pull request only what it touches is checked:
        # the dependencies (Cargo files, deny.toml) or the CI itself.
        # On main, everything always is.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qE '^(server/Cargo\.(toml|lock)|server/[^/]+/Cargo\.toml|server/deny\.toml|\.github/)'; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Nothing here for this job: skipped."
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        if: steps.changed.outputs.run == 'true'
        with:
          manifest-path: server/Cargo.toml
          command: check

  client:
    name: Client (Godot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: What changed
        id: changed
        # On a pull request only what it touches is checked:
        # the client, the protocol it mirrors, the content its tests read, or the CI itself.
        # On main, everything always is.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD | grep -qE '^(client/|server/protocol/|content/|\.github/)'; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Nothing here for this job: skipped."
            fi
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Godot (headless)
        if: steps.changed.outputs.run == 'true'
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_SHA512}  godot.zip" | sha512sum --check --strict
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
      - name: Import cache
        if: steps.changed.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # What the import makes (`client/.godot`) follows from the assets,
        # their import settings (`*.import`), the project's (`project.godot`)
        # and Godot's version: the key hashes all of them (every file of the
        # client and of the art but the scripts), so any change to one gives
        # a new key and a fresh import. No fallback to an older key: a cache
        # is only ever restored for the very assets it was imported from, so
        # a stale one cannot hide an import that breaks.
        with:
          path: client/.godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('client/**', 'content/art/**', '!client/**/*.gd', '!client/**/*.uid') }}
      - name: Import project
        if: steps.changed.outputs.run == 'true'
        run: godot --headless --path client --import
      - name: Run client tests
        if: steps.changed.outputs.run == 'true'
        run: godot --headless --path client -s tests/run_tests.gd
