name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  server-linux:
    name: Build server (Linux x86_64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: server
      - name: Build
        run: cargo build --release -p server
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/server "dist/soul-invasion-server-${GITHUB_REF_NAME}-linux-x86_64"
          cp ../LICENSE dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-linux
          path: server/dist/*

  publish:
    name: Publish GitHub release
    needs: [server-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: dist/*

# The client export (Godot export templates) will be added to this workflow
# once the client has something worth shipping.
